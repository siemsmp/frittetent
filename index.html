<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frietimperium</title><meta name="theme-color" content="#fbf1ff">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf1ff;--card:#fff;--paper:#fff;--ink:#3a2147;--mut:#7a6890;--red:#ff5a4a;--yel:#ffc233;--ok:#2ec4a0;--line:#eadff5;--sky:#4ea8ff;--pink:#ff9ec7;--hd:"Fredoka","Arial Rounded MT Bold","Arial Black",sans-serif;--bd:"Nunito",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--bd)}
main{max-width:580px;margin:0 auto;padding:14px 12px 200px}
h1{font:22px var(--hd);margin:0;color:var(--red)}
header{display:flex;justify-content:space-between;align-items:center}
.sub{color:var(--mut);font-size:14px}
.stats{background:#1c1633;color:var(--yel);border-radius:12px;padding:12px 16px;margin:10px 0;display:flex;justify-content:space-between;align-items:end;gap:8px}
.stats b{font:28px var(--hd);display:block;line-height:1.1}.stats small{color:#fbeedd;opacity:.85}
#sell{width:100%;border:0;border-radius:14px;background:var(--red);color:#fff;font:17px var(--hd);padding:15px;cursor:pointer;box-shadow:0 5px 0 #8c1a13;position:relative}
#sell:active{transform:translateY(4px);box-shadow:0 1px 0 #8c1a13}
.pop{position:absolute;right:16px;top:-6px;color:var(--yel);font:16px var(--hd);animation:up .7s forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-30px);opacity:0}}
/* restaurant */
#sw{margin-top:10px;overflow:hidden;border-radius:14px}
#scene{position:relative;width:540px;height:262px;transform-origin:0 0;border-radius:14px;overflow:hidden;border:3px solid #1c1633;background:#d9c298}
#scene>*,#stat>*{position:absolute}#stat{inset:0}
#act{inset:0;pointer-events:none;z-index:4}
.wall{left:0;right:0;top:0;height:124px;background:var(--wl)}
.wains{left:0;right:0;top:86px;height:38px;background:rgba(0,0,0,.14);border-top:3px solid rgba(255,255,255,.55)}
.fl{left:0;right:0;top:124px;bottom:0;background:conic-gradient(#efe0c2 25%,#d9c298 0 50%,#efe0c2 0 75%,#d9c298 0) 0 0/34px 34px;border-top:6px solid #5d3a18}
.kitw{left:0;width:52%;top:0;height:124px;background:linear-gradient(90deg,rgba(0,0,0,.07) 1px,#0000 1px) 0 0/22px 22px,linear-gradient(rgba(0,0,0,.07) 1px,#0000 1px) 0 0/22px 22px,#e4e9ec;border-right:4px solid #1c1633}
.kfl{left:0;width:52%;top:124px;height:30px;background:#6f757a;border-right:4px solid #1c1633}
.glowL{inset:0;background:radial-gradient(circle at 70% 10%,rgba(255,196,80,.5),transparent 70%);pointer-events:none;z-index:3}
.sgn{left:22%;width:28%;top:4px;background:var(--yel);color:#1c1633;border:3px solid #1c1633;border-radius:8px;text-align:center;font:11px var(--hd);padding:2px;white-space:nowrap;overflow:hidden}
.sgn.glow{box-shadow:0 0 12px 3px #fff3a0}
.hood{left:22%;width:28%;top:32px;height:14px;background:#9aa3a9;border:2px solid #1c1633;border-radius:4px 4px 0 0}
.menu{left:2%;width:19%;top:26px;background:#1c1633;color:var(--yel);font:8px/1.3 var(--hd);text-align:center;padding:3px;border-radius:4px}
.bsp{left:22%;width:28%;top:100px;height:24px;background:#aab3b9;border:2px solid #6f757a}
.shf{left:22%;width:28%;top:74px;height:4px;background:#9a9a9a}
.ap{top:104px;font-size:26px;line-height:1;white-space:nowrap}
.ap.jb i{font-style:normal;animation:bob .6s infinite alternate;display:inline-block}
.dsg{left:2%;top:112px;background:var(--red);color:#fff;font:9px var(--hd);padding:2px 4px;border-radius:4px;z-index:2}
.cnt{left:0;width:52%;top:154px;height:42px;background:repeating-linear-gradient(90deg,#8a5a2b 0 18px,#7a4a24 18px 20px);border-top:6px solid #c58a4a;border-right:4px solid #1c1633;z-index:2}
.reg{top:128px;font-size:22px;line-height:1;z-index:2}
.ban{left:3%;top:166px;background:var(--red);color:#fff;font:10px var(--hd);padding:3px 8px;border-radius:6px;z-index:3}
.lp{top:0;font-size:18px}
.wn{top:12px;width:50px;height:34px;background:var(--sky,linear-gradient(#8fd3ff,#e6f6ff));border:3px solid #1c1633;border-radius:4px;overflow:hidden}
.sc{position:absolute;top:10px;font-size:18px;animation:ride 6s linear infinite}
@keyframes ride{from{right:-24px}to{right:105%}}
.shfr{left:56%;width:42%;top:74px;height:5px;background:#8a5a2b;border-radius:2px}
.dec{left:57%;top:50px;font-size:20px;display:flex;gap:6px;line-height:1}
.door{left:calc(100% - 18px);top:120px;width:18px;height:120px;background:linear-gradient(#bfe6ff,#eaf7ff);border:3px solid #5d3a18;border-right:0;z-index:1}
.opn{left:calc(100% - 40px);top:100px;background:#fff;color:var(--red);font:9px var(--hd);padding:1px 4px;border:2px solid #1c1633;border-radius:4px}
.mat{left:84%;top:238px;width:16%;height:8px;background:var(--red);border-radius:2px}
.tb{z-index:1;width:40px;height:44px}
@keyframes bob{to{transform:translateY(-4px)}}
.bump{animation:bump .4s}@keyframes bump{40%{transform:scale(1.02)}}
.new{animation:pin .6s}@keyframes pin{0%{transform:scale(0)}60%{transform:scale(1.5)}100%{transform:scale(1)}}
.ac{position:absolute;width:26px;text-align:center;line-height:1;transition:left 1.1s linear,top 1.1s linear;isolation:isolate}
.hd{display:block;font-size:20px}
.bd{display:block;width:14px;height:16px;margin:-2px auto 0;border-radius:6px 6px 3px 3px;animation:sway .9s ease-in-out infinite alternate}
@keyframes sway{to{transform:translateY(-2px)}}
.pp::before{content:"";position:absolute;left:3px;bottom:-3px;width:20px;height:6px;border-radius:50%;background:rgba(0,0,0,.2);z-index:-1}
.pp .mb{position:absolute;left:-8px;top:-20px;font-size:15px;background:#fff;border:1px solid #1c1633;border-radius:8px;padding:0 3px;line-height:1.2;white-space:nowrap}
.pp .mb:empty{display:none}
.cook{width:30px}.cook .hd{font-size:28px}
@keyframes wk{from{transform:rotate(-9deg)}to{transform:rotate(9deg) translateY(-3px)}}
#dtw{left:2%;top:58px;width:19%;height:50px;overflow:hidden;border:3px solid #1c1633;border-radius:4px;background:linear-gradient(#0000 62%,#4a4a4a 62%),var(--sky,linear-gradient(#8fd3ff,#e6f6ff));z-index:2;display:none}
#dtw.on{display:block}
.car{width:36px}.car .hd{font-size:26px}.car .mb{position:absolute;left:10px;top:-14px;font-size:13px}
.ac svg,.ap svg,.tb svg{display:block;overflow:visible}
.pp svg{animation:sway 1.4s ease-in-out infinite alternate}
.arm,.lg1,.lg2{transform-box:fill-box;transform-origin:50% 0}
.mv .lg1{animation:step .28s infinite alternate}.mv .lg2{animation:step .28s infinite alternate-reverse}
.mv .a1{animation:step .28s infinite alternate-reverse}.mv .a2{animation:step .28s infinite alternate}
@keyframes step{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.cook.wk .a1{animation:stir calc(var(--ws,.6s)/2) infinite alternate}.cook.wk .a2{animation:stir calc(var(--ws,.6s)/2) infinite alternate-reverse}
@keyframes stir{from{transform:rotate(-32deg)}to{transform:rotate(32deg)}}
.cook .tool{opacity:0}.cook.wk .tool{opacity:1}
.sit .lg1,.sit .lg2{display:none}
.bb{animation:bub 1s infinite;transform-box:fill-box}.bb.b2{animation-delay:.5s}
@keyframes bub{to{transform:translateY(-4px);opacity:0}}
.fl2{animation:flick .3s infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scaleY(1.5)}}
.gl{animation:blink 1.6s infinite}@keyframes blink{50%{opacity:.35}}
.rc{animation:rcp 4s infinite}@keyframes rcp{0%,60%{transform:translateY(4px)}80%,100%{transform:translateY(0)}}
.nt{animation:bob .6s infinite alternate}
.mh{animation:rot 60s linear infinite;transform-origin:13px 13px}@keyframes rot{to{transform:rotate(360deg)}}
.pf{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.8);animation:pf 2.2s infinite;top:62px}
@keyframes pf{from{transform:translateY(0) scale(.6);opacity:.8}to{transform:translateY(-22px) scale(1.5);opacity:0}}
.vig{inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.3))}
.cnt::after{content:"";position:absolute;left:0;right:0;top:20px;height:3px;background:#d4a64a}
.door::after{content:"";position:absolute;left:2px;top:56px;width:4px;height:12px;background:#d4a64a;border-radius:2px}
.opn{animation:blink 2s infinite}
.wn::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 47%,#1c1633 47% 53%,transparent 53%),linear-gradient(transparent 47%,#1c1633 47% 53%,transparent 53%)}
.star{z-index:6;border:0;background:none;font-size:34px;cursor:pointer;animation:bob .5s infinite alternate;filter:drop-shadow(0 0 8px #ffd54a);padding:0}
.cp{position:absolute;color:#ffe066;font:12px var(--hd);text-shadow:0 0 3px #1c1633,0 0 3px #1c1633;animation:cp 1.2s forwards;z-index:6;white-space:nowrap}
@keyframes cp{to{transform:translateY(-28px);opacity:0}}
#rush{left:0;right:0;margin:0 auto;width:max-content;top:6px;background:var(--red);color:#fff;font:11px var(--hd);padding:4px 10px;border-radius:12px;z-index:6;display:none;border:2px solid #fff}
#rush.on{display:block}
#scene.night::after{content:"";position:absolute;inset:0;background:rgba(10,20,60,.3);z-index:3;pointer-events:none}
.cook.wk::after{content:"♨️";position:absolute;left:20px;top:-8px;font-size:14px}
.tabs{display:flex;gap:6px;margin-top:10px}
.tabs button{flex:1;padding:8px 4px;border:2px solid var(--line);background:none;color:var(--ink);border-radius:10px;font:700 13px var(--bd);cursor:pointer}
.tabs .on{background:var(--yel);color:#1c1633;border-color:#1c1633}
/* lijst */
.ticket{background:var(--paper);margin-top:16px;padding:14px;border-radius:4px 4px 0 0;border:1px solid var(--line);border-bottom:0;padding-bottom:26px;
 -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%}
.ticket h2{font:19px var(--hd);margin:0}
.bar{height:10px;background:var(--line);border-radius:6px;margin:10px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.up{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:2px dashed var(--line)}
.up .e{font-size:26px}.up .t{flex:1;min-width:0}.up b{display:block}.up .sub{font-size:13px}
.up button,#nieuw{border:0;border-radius:10px;background:var(--yel);color:#1c1633;font:700 15px var(--bd);padding:10px 12px;cursor:pointer;min-width:92px}
.up button:disabled,#nieuw:disabled{opacity:.45;cursor:not-allowed}.up button.max{background:var(--ok);color:#fff;opacity:1}
#klaar{display:none;margin-top:12px;padding:12px;background:var(--ok);color:#fff;border-radius:10px}#klaar p{margin:0 0 8px}#nieuw{width:100%;background:#fff;color:#1c5a35}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.chips span{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:13px}
.tools{display:flex;gap:8px;margin-top:16px}.tools button{flex:1;background:none;border:1px solid var(--mut);color:var(--ink);border-radius:10px;padding:9px;font:inherit;cursor:pointer}
/* zakenman */
#boss{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;padding:0 12px;transform:translateY(130%);transition:transform .55s cubic-bezier(.2,1.2,.3,1);z-index:5}
#boss.in{transform:none}
#boss .av{font-size:44px;width:76px;height:76px;margin-bottom:-26px;z-index:1;background:var(--yel);border-radius:50%;display:grid;place-items:center;border:4px solid #1c1633;box-shadow:0 4px 12px rgba(0,0,0,.4)}
#boss.in .av{animation:hop 1s ease-in-out infinite alternate}@keyframes hop{to{transform:translateY(-8px) rotate(-4deg)}}
#boss .bub{width:100%;max-width:400px;background:#fff;color:#1c1633;border:3px solid #1c1633;border-radius:16px;padding:30px 12px 10px;font-size:14px;line-height:1.35;box-shadow:0 4px 0 rgba(0,0,0,.25);max-height:45vh;overflow:auto}
#boss .bub b{display:block;font:12px var(--hd);color:var(--red);margin-bottom:2px}
#bok{margin-top:8px;border:0;background:var(--red);color:#fff;border-radius:10px;padding:7px 16px;font:700 14px var(--bd);cursor:pointer}
.ch{display:block;width:100%;text-align:left;margin-top:8px;border:2px solid #1c1633;background:var(--yel);color:#1c1633;border-radius:12px;padding:7px 10px;font:700 14px var(--bd);cursor:pointer}
.ch small{display:block;font-weight:400;font-size:12px}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.cu,.sc,.w,.st,.dt,.jb i,#boss.in .av{animation:none}#boss{transition:none}}
/* thema */
html{background:#fbf1ff}
body{background:radial-gradient(700px 420px at 8% -4%,#ffe0bd,transparent 62%),radial-gradient(760px 520px at 100% 6%,#d4e2ff,transparent 62%),radial-gradient(700px 520px at 50% 105%,#ffd0e2,transparent 62%),#fbf1ff;background-attachment:fixed;color:var(--ink);font-family:var(--bd)}
main{max-width:600px;padding:16px 12px 230px}
header{margin-bottom:12px}
h1{display:flex;align-items:center;gap:12px;margin:0;font:700 30px/1 var(--hd);color:var(--ink)}
.wm{display:block;background:linear-gradient(90deg,#ff5a4a,#ff9a2e);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.3px}
.tag{display:block;font:700 12px var(--bd);color:var(--mut);margin-top:3px;letter-spacing:.2px}
.lg{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#ffe08a,#ffb627);box-shadow:0 4px 0 #d98e00,0 10px 18px rgba(255,182,39,.35),inset 0 2px 0 rgba(255,255,255,.7);font-size:26px;transform:rotate(-6deg)}
.hr{display:flex;align-items:center;gap:8px}
#ownerTag{background:#fff;color:var(--mut);border-radius:999px;padding:6px 14px;font:800 13px var(--bd);box-shadow:0 4px 12px rgba(90,50,140,.14)}
#snd{width:42px;height:42px;border-radius:50%;border:0;background:#fff;font-size:18px;cursor:pointer;box-shadow:0 4px 12px rgba(90,50,140,.14)}
.rib{position:relative;z-index:3;width:max-content;max-width:92%;margin:0 auto -9px;padding:6px 24px;font:700 17px var(--hd);color:#fff;background:linear-gradient(180deg,#ff7a63,#ff4f3f);border-radius:12px;box-shadow:0 4px 0 #c93a2c,0 8px 14px rgba(255,79,63,.3),inset 0 2px 0 rgba(255,255,255,.4);text-shadow:0 2px 0 rgba(0,0,0,.18);white-space:nowrap}
#sw{border:6px solid #fff;border-radius:26px;background:#fff;box-shadow:0 14px 34px rgba(90,50,140,.28);margin-top:0}
#scene{border:0;border-radius:0}
.hud{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 2px}
.hud span{background:#fff;border-radius:999px;padding:5px 12px;font:800 13px var(--bd);color:var(--ink);box-shadow:0 3px 10px rgba(90,50,140,.12);font-variant-numeric:tabular-nums}
.hud .g{background:#c9f5e3}.hud .y{background:#ffefb8}.hud .r{background:#ffc9c0}
.dock{position:sticky;top:8px;z-index:9;display:flex;gap:12px;align-items:center;margin:12px 0 12px;padding:12px 14px 12px 18px;border-radius:26px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:2px solid #fff;box-shadow:0 12px 30px rgba(90,50,140,.22),inset 0 2px 0 #fff}
.st{display:flex;flex-wrap:wrap;gap:0 20px;flex:1;min-width:0;align-items:end}
.st>div{min-width:0}.st small{display:block;font:700 11px var(--bd);color:var(--mut);letter-spacing:.2px}
.st b{display:block;font:700 28px/1.1 var(--hd);color:var(--ink);font-variant-numeric:tabular-nums}
.st #ink{color:#12a37f}
#bonus{flex-basis:100%;font-weight:800;color:var(--mut)}#bonus:empty{display:none}
#sell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:92px;height:92px;flex:none;border:0;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ff9a85,#ff4f3f 60%,#e03a2c);color:#fff;font:700 15px/1 var(--hd);box-shadow:0 6px 0 #b82f23,0 14px 24px rgba(255,79,63,.4),inset 0 3px 0 rgba(255,255,255,.45);padding:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#sell::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid rgba(255,79,63,.45);animation:rng 1.8s infinite;pointer-events:none}
@keyframes rng{from{transform:scale(.94);opacity:1}to{transform:scale(1.2);opacity:0}}
#sell:active{transform:translateY(5px);box-shadow:0 1px 0 #b82f23,0 6px 12px rgba(255,79,63,.4),inset 0 3px 0 rgba(255,255,255,.45)}
.bi{display:block;font-size:32px;line-height:1;transition:transform .1s}#sell:active .bi{transform:scale(.86) rotate(-10deg)}
#pv{display:block;font:800 11px var(--bd);color:#fff3c4;margin-top:2px}
.pop{right:14px;top:-6px;color:#fff;font:700 15px var(--hd);text-shadow:0 0 4px #b82f23,0 0 4px #b82f23}
.goal{display:flex;gap:12px;align-items:center;padding:10px 16px 10px 12px;margin:0 0 14px;border-radius:22px;background:linear-gradient(135deg,#7a5cff,#a15bff);color:#fff;box-shadow:0 10px 22px rgba(122,92,255,.35),inset 0 2px 0 rgba(255,255,255,.3)}
.gav{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#ffd66b;font-size:25px;flex:none;border:3px solid #fff}
.goal small{display:block;font:700 11px var(--bd);opacity:.85;letter-spacing:.3px}
.goal b{display:block;font:600 15px/1.25 var(--bd)}
.ticket{background:rgba(255,255,255,.93);border:2px solid #fff;border-radius:28px;box-shadow:0 14px 34px rgba(90,50,140,.18),inset 0 2px 0 #fff;padding:18px;-webkit-mask:none;mask:none;margin:0}
.th{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ticket h2{font:700 25px var(--hd);margin:0;color:var(--ink)}
.ticket .sub{color:var(--mut);font-weight:700;font-size:13px}
.ring{--p:0%;width:56px;height:56px;border-radius:50%;background:conic-gradient(#2ec4a0 var(--p),#eadff5 0);display:grid;place-items:center;flex:none}
.ring span{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#fff;font:700 13px var(--hd);color:var(--ink)}
.tabs{display:flex;gap:4px;background:#f1e9fa;border:0;border-radius:18px;padding:4px;margin:14px 0 0}
.tabs button{flex:1;border:0;border-radius:14px;background:none;color:#7a6890;padding:11px 2px;font:700 13px var(--bd);cursor:pointer}
.tabs .on{background:#fff;color:var(--ink);box-shadow:0 4px 10px rgba(90,50,140,.18)}
.bulk{display:flex;gap:6px;margin:12px 0 4px;align-items:center}
.bulk button{border:0;background:#f1e9fa;color:#5a4872;border-radius:999px;padding:7px 14px;font:800 13px var(--bd);cursor:pointer}
.bulk .on{background:#7a5cff;color:#fff}
.bulk #all{margin-left:auto;background:linear-gradient(180deg,#5ee0b8,#2ec4a0);color:#06432f;box-shadow:0 3px 0 #1f9c80}

.up::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--gc,#7a5cff)}
.up.g-staff{--gc:#4ea8ff;--gt:linear-gradient(145deg,#a5d8ff,#4ea8ff)}.up.g-rest{--gc:#ff6b8a;--gt:linear-gradient(145deg,#ffb3c3,#ff6b8a)}.up.g-kit{--gc:#ff9a2e;--gt:linear-gradient(145deg,#ffd9a0,#ff9a2e)}

 e.onclick=()=>{const g=Math.round(inc()*40);S.money+=g;pop(e.style.left,parseInt(e.style.top),"+"+fmt(g));e.remove()};$("scene").appendChild(e);setTimeout(()=>e.remove(),9000)}
function rush(){SM.rush=Date.now()+30000;$("rush").classList.add("on");setTimeout(()=>$("rush").classList.remove("on"),30000);say("Lunchdrukte! 30 seconden lang komen er twee keer zoveel klanten en verdien je 1,5 keer zoveel. Zorg dat je koks het aankunnen.")}
function tod(){const p=(Date.now()/240000)%1,nt=p>.6&&p<.9,ev=(p>=.5&&p<=.6)||p>=.9,sc=$("scene");
 sc.style.setProperty("--sky",nt?"linear-gradient(#0b1d3a,#27406b)":ev?"linear-gradient(#ff9a5a,#ffd9a0)":"linear-gradient(#8fd3ff,#e6f6ff)");sc.classList.toggle("night",nt)}
function offline(){const a=Math.min((Date.now()-(S.t||Date.now()))/1000,14400);
 if(a>60){const g=Math.round(inc()*a*.5);S.money+=g;setTimeout(()=>say("Welkom terug! Terwijl je weg was verdiende je zaak "+fmt(g)+"."),1200)}else setTimeout(()=>say(goal()),1200)}
function sl(){setTimeout(()=>{star();sl()},60000+Math.random()*60000)}
function rl(){setTimeout(()=>{rush();rl()},180000+Math.random()*120000)}
let last=Date.now(),sv=0,lt=Date.now();setInterval(()=>{const n=Date.now(),d=Math.min((n-lt)/1000,1);lt=n;sim(d)},250);
setInterval(()=>{const n=Date.now(),dt=Math.min((n-last)/1000,5);last=n;S.money+=inc()*dt;update();
 if(++sv>=50){sv=0;save()}},100);
build();fit();window.addEventListener("resize",fit);offline();tl();tod();setInterval(tod,5000);setTimeout(()=>{star();sl()},45000);setTimeout(rl,90000);setTimeout(()=>{if(!pend)dilemma()},150000);setTimeout(dl,150000);
</script></body></html>
